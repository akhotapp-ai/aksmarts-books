# Free hosting on Render.com: New → Blueprint → pick your GitHub repository with this folder.
# Render's free plan wipes its disk on every restart, so the data is kept in a free Postgres
# database instead (Neon.tech). Put its connection string in DATABASE_URL. See README section 2.
services:
  - type: web
    name: aksmarts-pdf          # your free address becomes https://aksmarts-pdf.onrender.com (if the name is free)
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL       # from Neon: Dashboard → Connect → copy the connection string
        sync: false
      - key: ADMIN_EMAIL        # your owner account, created on first start
        sync: false
      - key: ADMIN_PASSWORD     # at least 8 characters; only used to create the account
        sync: false
      - key: PUBLIC_URL         # e.g. https://pdf.aksmarts.com (set it once the domain works)
        sync: false
      - key: COMPANY_URL        # optional: your company site, e.g. https://aksmarts.com
        sync: false
      - key: GOOGLE_SITE_VERIFICATION  # optional: the code (or whole meta tag) from Google Search Console
        sync: false
      - key: ADSENSE_CLIENT     # optional: your AdSense publisher ID (ca-pub-…); empty = no ads
        sync: false
      - key: ADSENSE_SLOT       # optional: the ad unit ID from AdSense → Ads → By ad unit
        sync: false
      - key: SMTP_HOST          # optional: email alerts (README section 6b)
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM          # optional: sender shown on emails, e.g. "AK Smarts PDF <no-reply@aksmarts.com>"
        sync: false
