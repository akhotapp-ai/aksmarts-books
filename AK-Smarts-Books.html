.fl{font-size:13px;font-weight:600;margin:0 0 8px}
select.g2s{min-width:160px}select.g2s.ok{border-color:var(--ok);color:var(--ok);font-weight:700}select.g2s.no{border-color:#C0392B;color:#C0392B;font-weight:700}
@media (max-width:640px){.sg{min-width:0;flex:1}.fcard input,.fcard select{min-width:0;width:100%}.fcard label{flex:1 1 140px}.crd summary .mu{display:none}}
@media print{.seg,.tb2,.fcard,.crumbs,.crtop{display:none!important}.dlk{border:0}}
details.crd{background:none;border:0;border-top:1px solid var(--ln);border-radius:0;margin:16px 0 0;padding:14px 0 0}
details.crd>summary{display:flex;grid-template-columns:none;padding:0;border:0!important}
details *{box-sizing:border-box}
.fcard input[type=checkbox]{min-width:0;width:auto}.fcard label.chk{flex-direction:row;display:flex;align-items:center;gap:8px}
.sg:not(:has(small)){min-width:0;padding:10px 18px}

[hidden]:not(.nsub){display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
form.ffw{position:relative;padding-top:54px}
.ffb{position:absolute;top:12px;right:12px;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:9px;padding:6px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ffb:hover,.ffb[aria-expanded=true]{color:var(--br);border-color:var(--br)}
.ffb:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.ffm{position:absolute;top:50px;right:12px;z-index:6;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 12px 32px #0003;padding:14px 16px;width:min(310px,calc(100% - 24px));display:grid;gap:4px;max-height:min(70vh,520px);overflow:auto}
.ffm p{margin:0 0 6px;font-size:12.5px}.ffm .chk{font-weight:500;padding:4px 0}
details.more{margin-top:14px;border:1px dashed var(--ln);border-radius:12px;padding:0 14px}
details.more>summary{cursor:pointer;padding:11px 0;font-weight:700;color:var(--br);list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--tint);font-weight:800}
details.more[open]>summary::before{content:"−"}
details.more>summary small{color:var(--mu);font-weight:500;font-size:12.5px}
details.more[open]{padding-bottom:14px}
details.more>.grid{margin-top:4px!important}
.toast{display:flex;align-items:center;gap:6px;max-width:calc(100% - 32px)}
.toast .ta{background:transparent;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:4px 12px;font:inherit;font-weight:700;cursor:pointer;margin-left:8px;flex:none}
.sto{font-size:12px;margin:0 0 4px}.sto .sok{display:block;color:var(--sdt);padding:4px 0;line-height:1.35}
.sto .sw{color:var(--am)!important;font-size:12px!important;padding:5px 0!important;white-space:normal;text-align:left;line-height:1.35}
.banner.warn{border-color:var(--am);background:color-mix(in srgb,var(--am) 12%,var(--sf))}
td.nx{white-space:nowrap;text-align:right}td.nx .lk+.lk{margin-left:10px}

/* ---- Top menu layout ---- */
body{display:block}
.side{position:sticky;top:0;z-index:40;height:auto;padding:0;display:block;overflow:visible;background:var(--sd);color:var(--sdt);box-shadow:0 2px 10px #0000001f}
.hrow{display:flex;align-items:center;gap:16px;padding:10px clamp(12px,2.5vw,28px);border-bottom:1px solid #ffffff12}
.side .logo{padding:0;flex:none;font-size:15px}.side .logo small{display:none}
.side .foot{margin:0 0 0 auto;display:flex;align-items:center;gap:10px;padding:0;font-size:12.5px}
.side .foot .nv{font-size:12.5px;padding:6px 10px;border-radius:8px;white-space:nowrap;font-weight:600}
.side .foot .bkb{border:1px solid #ffffff2e}
.sto{margin:0;display:flex;gap:8px;align-items:center}.sto .sok{display:inline;padding:0;color:#9fd8bf;white-space:nowrap}
.sto .sw{display:inline-block;white-space:nowrap!important;padding:6px 10px!important;border-radius:8px;background:#e9a93f1f;max-width:240px;overflow:hidden;text-overflow:ellipsis}
#pfb{display:flex;gap:4px;align-items:center}.pfu{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;align-items:center;gap:2px;padding:3px clamp(8px,2vw,22px);flex-wrap:wrap}
.ng{position:relative}
.menu .sec{width:auto;padding:10px 12px;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--sdt);font-weight:600;border-radius:8px 8px 0 0;gap:7px}
.menu .sec:hover,.menu .sec[aria-expanded=true]{background:#ffffff12;color:#fff}
.menu .sec.on,.menu .nv.top.on{color:#fff;box-shadow:inset 0 -3px 0 var(--am)}
.menu .sec .cv{width:6px;height:6px;transform:rotate(45deg);margin-top:-3px}.menu .sec[aria-expanded=true] .cv{transform:rotate(-135deg);margin-top:3px}
.menu .sec[aria-expanded=true] .nb{display:inline-block}
.menu .nv.top{margin:0;padding:10px 12px;font-size:13.5px;color:var(--sdt);border-radius:8px 8px 0 0}.menu .nv.top:hover{background:#ffffff12;color:#fff}.menu .nv.top.on{background:transparent}
.nsub{position:absolute;top:100%;left:0;min-width:240px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:0 12px 12px 12px;box-shadow:0 14px 34px #00000030;padding:6px;z-index:50;gap:1px}
.nsub .nv{color:var(--ink);font-size:14px;padding:9px 12px;border-radius:8px}.nsub .nv:hover{background:var(--tint)}.nsub .nv.on{background:var(--tint);color:var(--br)}
.ng:last-child .nsub,.ng:nth-last-child(2) .nsub{left:auto;right:0;border-radius:12px 0 12px 12px}
main{margin:0 auto;max-width:1280px}
.mbtn{all:unset;display:none;box-sizing:border-box;cursor:pointer;color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid #ffffff2e;align-items:center;gap:8px}
.mbtn i{width:14px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}.mbtn i::after{content:"";position:absolute;left:0;right:0;top:2px;border-top:2px solid currentColor}
.mbtn:focus-visible,.cob:focus-visible{outline:2px solid var(--am);outline-offset:2px}
/* Company switch */
.cosw{position:relative;flex:none}
.cob{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:10px;background:#16365f;border:1px solid #2d5590;color:#fff;max-width:320px}
.cob:hover{background:#1c4275}.cob[disabled]{opacity:.6;cursor:default}
.cob i{font-style:normal;width:30px;height:30px;border-radius:8px;background:#fff;color:#16365f;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.cob span{color:#fff;display:flex;flex-direction:column;min-width:0;line-height:1.15}.cob small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a9c1e4;font-weight:700}
.cob b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.cob .cv{width:6px;height:6px;border-right:2px solid #a9c1e4;border-bottom:2px solid #a9c1e4;transform:rotate(45deg);margin:-3px 0 0 4px;flex:none}
.cod{position:absolute;top:calc(100% + 6px);left:0;min-width:270px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:12px;box-shadow:0 14px 34px #00000030;padding:6px;z-index:60;display:flex;flex-direction:column;gap:1px}
.coh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700;padding:6px 10px}
.coi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;padding:8px 10px 8px 28px;border-radius:8px;position:relative}.coi:hover{background:var(--tint)}.coi:focus-visible{outline:2px solid var(--br)}
.coi small{color:var(--mu);font-size:12px}.coi.on::before{content:"✓";position:absolute;left:10px;top:8px;color:var(--br);font-weight:800}
.coi.mg{border-top:1px solid var(--ln);border-radius:0 0 8px 8px;margin-top:4px;padding-left:10px;color:var(--br);font-weight:700}
@media(max-width:900px){
 .side{position:sticky;flex-direction:column;overflow:visible;padding:0}
 .hrow{flex-wrap:wrap;gap:10px}.side .logo span{display:none}
 .mbtn{display:inline-flex;margin-left:auto}.side .foot{order:5;width:100%;margin:0;display:flex}.sto .sok{white-space:normal}
 .cob b{max-width:150px}
 .menu{display:none;flex-direction:column;flex-wrap:nowrap;align-items:stretch;padding:6px 10px 12px;max-height:70vh;overflow-y:auto}.side.mo .menu{display:flex}
 .ng{position:static}.menu .sec{display:none!important}.nsub,.nsub[hidden]{display:contents}
 .nsub .nv,.menu .nv.top{color:#e2ece8;padding:9px 12px;border-radius:8px;box-shadow:none}.nsub .nv.on,.menu .nv.top.on{background:#ffffff1f;color:#fff}
}
.prt th,.prt td{white-space:nowrap;padding-left:6px;padding-right:6px}.prt input[type=number]{width:80px;min-width:0;padding:6px 8px;text-align:right}.prt td:nth-child(2){white-space:normal;min-width:110px}
.side .foot .instb{display:inline-flex;align-items:center;gap:6px;background:var(--am);color:#2b1c00;border:0}.side .foot .instb:hover{background:#f3bb5c}
@media (display-mode: standalone){.side{padding-top:env(titlebar-area-height,0px)}}
