<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>AK Smarts Books - Google sign-in</title>
</head>
<body style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:28px;color:#12201B;background:#F2F6F4">
<p id="m">Finishing Google sign-in…</p>
<script>
(function () {
  var p = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  var d = {
    s: p.get("state") || "",
    t: p.get("access_token") || "",
    e: Date.now() + (parseInt(p.get("expires_in"), 10) || 3600) * 1000,
    err: p.get("error") || ""
  };
  try { history.replaceState(null, "", location.pathname); } catch (x) {}
  var sent = false;
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ fdg: d }, location.origin);
      sent = true;
    }
  } catch (x) {}
  if (!sent) {
    try { localStorage.setItem("aks-findesk-gtok", JSON.stringify(d)); } catch (x) {}
  }
  document.getElementById("m").textContent = d.err
    ? "Google sign-in was not finished (" + d.err + "). You can close this window."
    : "Signed in. You can close this window and go back to AK Smarts Books.";
  setTimeout(function () { window.close(); }, 400);
})();
</script>
</body>
</html>
